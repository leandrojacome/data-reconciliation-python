[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "data-reconciliation-python"
version = "1.0.0"
description = "Explainable record reconciliation using clean architecture"
requires-python = ">=3.12"
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
